<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EQUIBOV — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="img/torito.png" />

  <style>
    @font-face {
      font-family: 'SOMER';
      src: url('fonts/Somer.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --primary:     #0F468C;
      --primary-dark: #0D3A73;
      --secondary:   #199CD8;
      --carbon:      #1C1C1E;
      --dark:        #3A3A3A;
      --mid:         #5F5E5A;
      --light:       #B4B2A9;
      --bone:        #C8D6E5;
      --cream:       #F0F4F8;
      --white:       #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Raleway', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      background: var(--primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 52px 56px;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 59px,
          rgba(255,255,255,0.03) 59px,
          rgba(255,255,255,0.03) 60px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 59px,
          rgba(255,255,255,0.03) 59px,
          rgba(255,255,255,0.03) 60px
        );
      pointer-events: none;
    }

    .left-panel::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -80px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 1;
    }

    .brand-tag {
      font-family: 'Raleway', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: var(--light);
      text-transform: uppercase;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.1s forwards;
    }

    .brand-name {
      font-family: 'SOMER', serif;
      font-size: 64px;
      font-weight: 600;
      color: var(--white);
      line-height: 1;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.2s forwards;
    }

    .brand-sub {
      font-family: 'Raleway', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: var(--bone);
      letter-spacing: 0.12em;
      margin-top: 10px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.3s forwards;
    }

    .left-footer {
      position: relative;
      z-index: 1;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }

    .divider-line {
      width: 40px;
      height: 1px;
      background: var(--mid);
      margin-bottom: 20px;
    }

    .left-footer p {
      font-size: 11px;
      color: var(--mid);
      line-height: 1.7;
      letter-spacing: 0.04em;
      max-width: 280px;
    }

    .version-badge {
      display: inline-block;
      margin-top: 20px;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--mid);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 2px;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px;
      background: var(--cream);
      position: relative;
    }

    .right-panel::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 1px;
      height: 100%;
      background: var(--bone);
    }

    .form-container {
      width: 100%;
      max-width: 360px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.4s forwards;
    }

    .login-img { display: block; width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin: 0 auto 28px; background: var(--cream); }

    .form-header {
      margin-bottom: 40px;
    }

    .form-header h2 {
      font-family: 'SOMER', serif;
      font-size: 32px;
      font-weight: 500;
      color: var(--primary);
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 11px;
      color: var(--mid);
      letter-spacing: 0.06em;
    }

    .field-group {
      margin-bottom: 24px;
    }

    .field-label {
      display: block;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--mid);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .field-input {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--bone);
      border-radius: 2px;
      padding: 12px 14px;
      font-family: 'Raleway', sans-serif;
      font-size: 13px;
      color: var(--carbon);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.02em;
    }

    .field-input::placeholder {
      color: var(--light);
      font-size: 12px;
    }

    .field-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,70,140,0.08);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--light);
      font-size: 11px;
      font-family: 'Raleway', sans-serif;
      letter-spacing: 0.05em;
      padding: 0;
      transition: color 0.2s;
    }

    .toggle-pw:hover { color: var(--mid); }

    .forgot-link {
      display: block;
      text-align: right;
      margin-top: 8px;
      font-size: 10px;
      color: var(--mid);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--primary); }

    .btn-login {
      width: 100%;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 2px;
      padding: 14px;
      font-family: 'Raleway', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 32px;
      position: relative;
      overflow: hidden;
      transition: background 0.2s;
    }

    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.2s;
    }

    .btn-login:hover { background: var(--primary-dark); }
    .btn-login:active::after { background: rgba(255,255,255,0.05); }

    .btn-login.loading {
      pointer-events: none;
      color: transparent;
    }

    .btn-login.loading::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(15,70,140,0.04);
      border-left: 2px solid var(--primary);
      font-size: 11px;
      color: #8B2E2E;
      letter-spacing: 0.04em;
    }

    .error-msg.visible { display: block; }

    .form-footer {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid var(--bone);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-footer span {
      font-size: 10px;
      color: var(--light);
      letter-spacing: 0.08em;
    }

    .register-link {
      font-size: 10px;
      color: var(--mid);
      text-decoration: none;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--bone);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .register-link:hover { color: var(--primary); border-color: var(--primary); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .left-panel { display: none; }
      .right-panel { padding: 40px 28px; }
    }
  </style>
</head>
<body>

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="brand">
      <p class="brand-tag">Sistema de gestión</p>
      <h1 class="brand-name">EQUI<br>BOV</h1>
      <p class="brand-sub">Andrología Bovina · Registro Clínico</p>
    </div>
    <div class="left-footer">
      <div class="divider-line"></div>
      <p>Plataforma de registro y seguimiento de evaluaciones andrológicas bovinas para médicos veterinarios.</p>
      <span class="version-badge">V 1.0.0</span>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="form-container">

      <img class="login-img" src="img/torito.png" alt="" />
      <div class="form-header">
        <h2>Iniciar sesión</h2>
        <p>Ingrese sus credenciales para continuar</p>
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Correo electrónico</label>
        <input
          class="field-input"
          type="email"
          id="email"
          placeholder="veterinario@ejemplo.com"
          autocomplete="email"
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Contraseña</label>
        <div class="password-wrapper">
          <input
            class="field-input"
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
            style="padding-right: 60px;"
          />
          <button class="toggle-pw" type="button" id="togglePw">mostrar</button>
        </div>
        <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button class="btn-login" id="btnLogin" type="button">
        Ingresar
      </button>

      <div class="form-footer">
        <span>¿Sin cuenta?</span>
        <a href="#" class="register-link">Solicitar acceso →</a>
      </div>

    </div>
  </div>

  <!-- ── SUPABASE ── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── ELEMENTOS ──
    const emailInput  = document.getElementById('email');
    const pwInput     = document.getElementById('password');
    const btnLogin    = document.getElementById('btnLogin');
    const togglePw    = document.getElementById('togglePw');
    const errorMsg    = document.getElementById('errorMsg');

    // ── MOSTRAR / OCULTAR CONTRASEÑA ──
    togglePw.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type  = isText ? 'password' : 'text';
      togglePw.textContent = isText ? 'mostrar' : 'ocultar';
    });

    // ── MOSTRAR ERROR ──
    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function clearError() {
      errorMsg.classList.remove('visible');
    }

    // ── LOGIN ──
    btnLogin.addEventListener('click', async () => {
      clearError();
      const email    = emailInput.value.trim();
      const password = pwInput.value;

      if (!email || !password) {
        showError('Por favor complete todos los campos.');
        return;
      }

      btnLogin.classList.add('loading');

      const { error } = await sb.auth.signInWithPassword({ email, password });

      btnLogin.classList.remove('loading');

      if (error) {
        showError('Credenciales incorrectas. Verifique e intente de nuevo.');
        return;
      }

      // Redirigir al dashboard
      window.location.href = 'dashboard.html';
    });

    // ── ENTER para enviar ──
    [emailInput, pwInput].forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') btnLogin.click();
      });
    });

    // ── Si ya hay sesión activa, redirigir ──
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();
  </script>

</body>
</html>
